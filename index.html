<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="便签">
<meta name="theme-color" content="#f5c542">
<link rel="apple-touch-icon" href="icon.png">
<title>便签查看器</title>
<style>
:root{
  --bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--sub:#8e8e93;--line:#e5e5ea;
  --accent:#d99a00;--chip:#e9e9ee;--hl:#ffe680;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#000;--card:#1c1c1e;--text:#f2f2f7;--sub:#8e8e93;--line:#38383a;
  --accent:#ffc83d;--chip:#2c2c2e;--hl:#6b5500}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif}
button{font:inherit;color:inherit}
#app{max-width:720px;margin:0 auto;min-height:100%;position:relative}
.view{display:none;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.view.on{display:block}

/* 顶栏 */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 10px) 16px 8px}
.bar-row{display:flex;align-items:center;gap:8px}
.bar h1{font-size:28px;margin:0;flex:1}
.icon-btn{border:0;background:var(--chip);width:38px;height:38px;border-radius:19px;font-size:18px;cursor:pointer}
.icon-btn.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.search{width:100%;margin-top:8px;border:0;border-radius:10px;padding:9px 12px;
  background:var(--chip);color:var(--text);font-size:16px;outline:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--chip);padding:5px 14px;border-radius:16px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:#000;font-weight:600}
.status{font-size:12px;color:var(--sub);padding:2px 16px 6px}

/* 列表 */
.list{margin:0 16px 24px;background:var(--card);border-radius:12px;overflow:hidden}
.item{padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border-bottom:0}
.item:active{background:var(--chip)}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .p{color:var(--sub);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.item .m{color:var(--sub);font-size:12px;margin-top:2px}
.tag{background:var(--chip);border-radius:4px;padding:0 6px;margin-left:6px}
.empty{color:var(--sub);text-align:center;padding:48px 24px}
mark{background:var(--hl);color:inherit;border-radius:2px}

/* 详情 */
.detail-body{padding:8px 16px 40px}
.detail-body h2{margin:8px 0 4px;font-size:22px;word-break:break-all}
.detail-meta{color:var(--sub);font-size:13px;margin-bottom:12px}
.content{background:var(--card);border-radius:12px;padding:14px 16px;white-space:pre-wrap;
  word-break:break-all;font-size:16px;-webkit-user-select:text;user-select:text}
.editor{position:relative;background:var(--card);border-radius:12px}
.editor .backdrop,.editor textarea{margin:0;padding:14px 16px;border:0;font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;letter-spacing:normal;width:100%}
.editor .backdrop{position:absolute;left:0;top:0;right:0;color:transparent;pointer-events:none;overflow:hidden;border-radius:12px}
.editor .backdrop mark{background:rgba(255,190,0,.32);color:transparent;border-radius:3px}
.editor textarea{position:relative;display:block;background:transparent;color:var(--text);
  resize:none;overflow:hidden;outline:none;-webkit-appearance:none;border-radius:12px;caret-color:var(--accent)}
.tip{color:var(--sub);font-size:12px;margin:10px 4px 0}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%) translateY(-160px);
  background:#34a853;color:#fff;padding:8px 18px;border-radius:20px;font-size:15px;font-weight:600;
  transition:transform .2s;z-index:20;pointer-events:none;white-space:nowrap}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.warn{background:#8e8e93}
.pill.alt{background:var(--chip);color:var(--text);margin-right:8px}
.lock,.lock body{overflow:hidden;overscroll-behavior:none}
.chat-wrap{position:fixed;left:0;right:0;top:0;height:100vh;height:100dvh;max-width:720px;margin:0 auto;
  display:flex;flex-direction:column;background:var(--bg)}
.chat-msgs{flex:1;min-height:0;overflow-y:auto;padding:8px 12px 12px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.row{display:flex;margin:6px 0}
.row.me{justify-content:flex-end}
.row>div{max-width:82%;min-width:0}
.bub{padding:8px 12px;border-radius:14px;background:var(--card);word-break:break-all;
  white-space:pre-wrap;-webkit-user-select:text;user-select:text;font-size:16px}
.row.me .bub{background:#b6e388;color:#111}
@media (prefers-color-scheme:dark){.row.me .bub{background:#2b5278;color:#f2f2f7}}
.bmeta{font-size:11px;color:var(--sub);margin-top:3px;display:flex;gap:10px;-webkit-user-select:none;user-select:none}
.bmeta button{border:0;background:none;color:var(--accent);font-size:12px;padding:0;cursor:pointer}
.row.me .bmeta{justify-content:flex-end}
.compose{flex:none;display:flex;flex-direction:column;gap:8px;padding:8px 12px calc(env(safe-area-inset-bottom) + 8px);
  background:var(--bg);border-top:1px solid var(--line)}
.compose textarea{width:100%;border:0;border-radius:12px;padding:10px 14px;background:var(--card);color:var(--text);
  font-size:16px;line-height:1.4;font-family:inherit;resize:none;min-height:44px;max-height:120px;outline:none;display:block}
#chat-status{min-height:18px;line-height:18px}
.cbtns{display:flex;gap:8px}
.cbtns button{flex:1;border:0;border-radius:12px;height:42px;background:var(--accent);color:#000;font-weight:600;font-size:16px;cursor:pointer}
.cbtns button.alt{background:var(--chip);color:var(--text)}
.compose button:disabled{opacity:.5}
.sep{height:1px;background:var(--line);margin:28px 4px 0}
.back{border:0;background:none;color:var(--accent);font-size:17px;cursor:pointer;padding:0}
.pill{border:0;background:var(--accent);color:#000;padding:6px 14px;border-radius:16px;font-weight:600;cursor:pointer}

/* 设置 */
.form{margin:8px 16px 24px}
.form label{display:block;font-size:13px;color:var(--sub);margin:16px 4px 6px}
.form input{width:100%;border:0;border-radius:10px;padding:11px 12px;background:var(--card);
  color:var(--text);font-size:16px;outline:none}
.form .hint{font-size:12px;color:var(--sub);margin:6px 4px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;margin-top:20px;
  background:var(--accent);color:#000;font-weight:600;font-size:17px;cursor:pointer}
.btn.ghost{background:var(--chip);color:var(--text);margin-top:10px}
.err{color:#ff453a;font-size:14px;margin:12px 4px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<div id="app">

  <!-- 列表页 -->
  <section class="view" id="v-list">
    <div class="bar">
      <div class="bar-row">
        <h1>便签</h1>
        <button class="icon-btn" id="btn-chat" title="与电脑聊天">💬</button>
        <button class="icon-btn" id="btn-refresh" title="从 GitHub 刷新">↻</button>
        <button class="icon-btn" id="btn-settings" title="设置">⚙︎</button>
      </div>
      <input class="search" id="q" type="search" placeholder="搜索标题或内容" autocomplete="off">
      <div class="chips" id="chips"></div>
    </div>
    <div class="status" id="status"></div>
    <div class="list" id="list"></div>
  </section>

  <!-- 详情页 -->
  <section class="view" id="v-detail">
    <div class="bar">
      <div class="bar-row">
        <button class="back" id="btn-back">‹ 返回</button>
        <span style="flex:1"></span>
        <button class="pill alt" id="btn-copy-all">复制全文</button>
        <button class="pill" id="btn-copy">📋 复制</button>
      </div>
    </div>
    <div class="detail-body">
      <h2 id="d-title"></h2>
      <div class="detail-meta" id="d-meta"></div>
      <div class="editor"><div class="backdrop" id="backdrop"></div><textarea id="d-content" readonly spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" inputmode="none"></textarea></div>
      <div class="tip">选中文字后点「复制」＝复制选中部分；没选中＝复制高亮的那一行（点一下文字可以移动高亮行）。</div>
    </div>
  </section>

  <!-- 聊天页 -->
  <section class="view" id="v-chat">
    <div class="chat-wrap">
      <div class="bar" style="flex:none">
        <div class="bar-row">
          <button class="back" id="btn-chat-back">‹ 返回</button>
          <h1 style="font-size:18px;text-align:center">手机 ↔ 电脑</h1>
          <button class="icon-btn" id="btn-chat-set" title="聊天设置" style="width:34px;height:34px;font-size:16px">⚙︎</button>
        </div>
        <div class="status" style="padding:4px 0 0" id="chat-status"></div>
      </div>
      <div class="chat-msgs" id="chat-msgs"></div>
      <div class="compose">
        <textarea id="chat-input" rows="1" placeholder="输入要发到电脑的文字" autocomplete="off"></textarea>
        <div class="cbtns">
          <button id="chat-paste" class="alt">📋 粘贴发送</button>
          <button id="chat-send">发送</button>
        </div>
      </div>
    </div>
  </section>

  <!-- 设置页 -->
  <section class="view" id="v-settings">
    <div class="bar">
      <div class="bar-row">
        <button class="back" id="btn-set-back">‹ 返回</button>
        <h1 style="font-size:20px;text-align:center">GitHub 设置</h1>
        <span style="width:50px"></span>
      </div>
    </div>
    <div class="form">
      <label>备份仓库地址</label>
      <input id="f-repo" placeholder="https://github.com/用户名/仓库名" autocapitalize="off" autocorrect="off" spellcheck="false">
      <label>分支</label>
      <input id="f-branch" placeholder="main" value="main" autocapitalize="off" autocorrect="off" spellcheck="false">
      <label>访问令牌（PAT）</label>
      <input id="f-token" type="password" placeholder="github_pat_…" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="hint">建议在 GitHub 新建一个 Fine-grained token，只授权这个备份仓库，权限选 Contents: Read-only（只读）。令牌只保存在这台手机的浏览器里，不会发给除 GitHub 以外的任何地方。</div>
      <div class="err" id="f-err"></div>
      <button class="btn" id="btn-save">保存并同步</button>
      <button class="btn ghost" id="btn-clear">清除本机数据</button>

      <div class="sep"></div>
      <label style="margin-top:20px;font-weight:600;color:var(--text);font-size:15px">聊天设置（手机 ↔ 电脑）</label>
      <div class="hint">建议单独新建一个仓库专门放聊天记录，令牌只授权这个仓库，权限选 Contents: Read and write（读写）。聊天记录由电脑端负责清理。</div>
      <label>聊天仓库地址</label>
      <input id="f-crepo" placeholder="https://github.com/用户名/聊天仓库名" autocapitalize="off" autocorrect="off" spellcheck="false">
      <label>分支</label>
      <input id="f-cbranch" placeholder="main" value="main" autocapitalize="off" autocorrect="off" spellcheck="false">
      <label>聊天令牌（读写）</label>
      <input id="f-ctoken" type="password" placeholder="github_pat_…" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="err" id="f-cerr"></div>
      <button class="btn" id="btn-csave">保存聊天设置</button>
    </div>
  </section>
</div>

<script>
(function(){
  "use strict";
  var $ = function(id){return document.getElementById(id)};
  var KEY_CFG="sn.cfg", KEY_DATA="sn.data";
  var state={notes:[],cats:[],cat:"全部",q:"",cur:null,syncedAt:null};

  /* ---------- 本地存储（不可用时降级为内存） ---------- */
  var mem={};
  function sget(k){try{var v=localStorage.getItem(k);return v}catch(e){return mem[k]||null}}
  function sset(k,v){try{localStorage.setItem(k,v)}catch(e){mem[k]=v}}
  function sdel(k){try{localStorage.removeItem(k)}catch(e){delete mem[k]}}
  function loadJSON(k){try{return JSON.parse(sget(k)||"null")}catch(e){return null}}

  /* ---------- 工具 ---------- */
  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function hl(text,q){
    var t=esc(text); if(!q) return t;
    var re=new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"),"gi");
    return t.replace(re,function(m){return "<mark>"+m+"</mark>"});
  }
  function fmt(d){
    if(!d) return "";
    var x=new Date(d); if(isNaN(x)) return String(d);
    var p=function(n){return (n<10?"0":"")+n};
    return x.getFullYear()+"-"+p(x.getMonth()+1)+"-"+p(x.getDate())+" "+p(x.getHours())+":"+p(x.getMinutes());
  }
  function show(id){
    if(id!=="v-chat") stopChat();
    document.documentElement.classList.toggle("lock",id==="v-chat");
    if(id==="v-chat") fitChat(); 
    ["v-list","v-detail","v-settings","v-chat"].forEach(function(v){$(v).classList.toggle("on",v===id)});
    window.scrollTo(0,0);
  }
  function parseRepo(u){
    var m=String(u||"").trim().replace(/\.git$/,"").replace(/\/+$/,"")
      .match(/(?:github\.com[\/:])?([\w.-]+)\/([\w.-]+)$/);
    return m?{owner:m[1],repo:m[2]}:null;
  }

  /* ---------- GitHub 读取 ---------- */
  function ghGet(cfg,path){
    var url="https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+"/contents/"+path+
            "?ref="+encodeURIComponent(cfg.branch||"main")+"&_="+Date.now();
    return fetch(url,{headers:{
      "Accept":"application/vnd.github.raw+json",
      "Authorization":"Bearer "+cfg.token,
      "X-GitHub-Api-Version":"2022-11-28"
    },cache:"no-store"}).then(function(r){
      if(r.status===404) return null;
      if(r.status===401||r.status===403) throw new Error("令牌无效或没有该仓库的读取权限（HTTP "+r.status+"）");
      if(!r.ok) throw new Error("GitHub 返回 HTTP "+r.status);
      return r.text();
    });
  }
  function sync(){
    var cfg=loadJSON(KEY_CFG);
    if(!cfg){show("v-settings");return Promise.resolve()}
    $("btn-refresh").classList.add("spin");
    $("status").textContent="正在同步…";
    return Promise.all([ghGet(cfg,"notes.json"),ghGet(cfg,"categories.json")]).then(function(res){
      if(res[0]==null) return diagnose(cfg).then(function(m){throw new Error(m)});
      var t=res[0].replace(/^﻿/,"");
      var notes=JSON.parse(t);
      var cats=[]; try{cats=res[1]?JSON.parse(res[1].replace(/^﻿/,"")):[]}catch(e){}
      var data={notes:notes,cats:cats,syncedAt:Date.now()};
      sset(KEY_DATA,JSON.stringify(data));
      applyData(data);
      $("status").textContent="已同步 · "+fmt(data.syncedAt)+" · 共 "+notes.length+" 条";
    }).catch(function(e){
      var msg=(e&&e.message)||String(e);
      if(/Failed to fetch|NetworkError|Load failed/i.test(msg)) msg="网络连接失败，正在显示上次同步的内容";
      $("status").textContent="⚠️ "+msg;
    }).then(function(){$("btn-refresh").classList.remove("spin")});
  }
  function diagnose(cfg){
    var name=cfg.owner+"/"+cfg.repo;
    return fetch("https://api.github.com/repos/"+name,{headers:{
      "Accept":"application/vnd.github+json","Authorization":"Bearer "+cfg.token},cache:"no-store"})
    .then(function(r){
      if(r.status===401) return "令牌无效或已过期，请重新生成令牌";
      if(r.status===404) return "访问不到仓库 "+name+"：请检查①仓库地址是否写对 ②令牌创建时是否勾选了这个仓库（Only select repositories）③令牌权限是否包含 Contents: Read-only";
      if(r.ok) return "能访问仓库 "+name+"，但分支 "+(cfg.branch||"main")+" 的根目录里没有 notes.json，请检查分支名，或在电脑端重新备份并同步";
      return "GitHub 返回 HTTP "+r.status;
    }).catch(function(){return "网络连接失败"});
  }
  function applyData(d){
    state.notes=(d.notes||[]).slice().sort(function(a,b){
      return new Date(b.LastModified||0)-new Date(a.LastModified||0)});
    var set={}; (d.cats||[]).forEach(function(c){set[c]=1});
    state.notes.forEach(function(n){if(n.Category) set[n.Category]=1});
    state.cats=Object.keys(set);
    state.syncedAt=d.syncedAt;
    if(state.cat!=="全部" && !set[state.cat]) state.cat="全部";
    render();
  }

  /* ---------- 渲染 ---------- */
  function render(){
    var chips=["全部"].concat(state.cats);
    $("chips").innerHTML=chips.map(function(c){
      return '<button class="chip'+(c===state.cat?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'</button>'}).join("");
    var q=state.q.trim(), ql=q.toLowerCase();
    var rows=state.notes.filter(function(n){
      if(state.cat!=="全部" && n.Category!==state.cat) return false;
      if(!q) return true;
      return String(n.Title||"").toLowerCase().indexOf(ql)>=0 || String(n.Content||"").toLowerCase().indexOf(ql)>=0;
    });
    if(!rows.length){
      $("list").innerHTML='<div class="empty">'+(state.notes.length?'没有匹配的便签':'还没有数据<br>点右上角 ⚙︎ 填写 GitHub 信息')+'</div>';
      return;
    }
    $("list").innerHTML=rows.map(function(n){
      var body=String(n.Content||"").replace(/\s+/g," ").trim();
      if(q){ // 让命中的内容出现在预览里
        var i=body.toLowerCase().indexOf(ql);
        if(i>40) body="…"+body.slice(i-20);
      }
      body=body.slice(0,160);
      return '<div class="item" data-id="'+esc(n.Id)+'"><div class="t">'+hl(n.Title||"（无标题）",q)+'</div>'+
        '<div class="p">'+hl(body,q)+'</div>'+
        '<div class="m">'+esc(fmt(n.LastModified))+(n.Category?'<span class="tag">'+esc(n.Category)+'</span>':'')+'</div></div>';
    }).join("");
  }
  function openNote(id){
    var n=state.notes.filter(function(x){return x.Id===id})[0]; if(!n) return;
    state.cur=n;
    $("d-title").textContent=n.Title||"（无标题）";
    $("d-meta").textContent=fmt(n.LastModified)+(n.Category?" · "+n.Category:"");
    var ta=$("d-content"); ta.value=n.Content||"";
    show("v-detail");
    fitEditor(); ta.setSelectionRange(0,0); paintLine();
  }
  /* ---------- 复制：有选中复制选中，否则复制光标所在行（与电脑端一致） ---------- */
  function fitEditor(){var ta=$("d-content");ta.style.height="auto";ta.style.height=ta.scrollHeight+"px";
    $("backdrop").style.height=ta.scrollHeight+"px"}
  function lineRange(text,caret){
    caret=Math.min(Math.max(caret,0),text.length);
    var st=caret===0?0:text.lastIndexOf("\n",caret-1)+1;
    var en=text.indexOf("\n",caret); if(en<0) en=text.length;
    return [st,en];
  }
  function paintLine(){
    var ta=$("d-content"), t=ta.value, bd=$("backdrop");
    if(ta.selectionEnd>ta.selectionStart){bd.innerHTML=esc(t)+"\u200b";return}
    var r=lineRange(t,ta.selectionStart);
    bd.innerHTML=esc(t.slice(0,r[0]))+"<mark>"+esc(t.slice(r[0],r[1]))+"</mark>"+esc(t.slice(r[1]))+"\u200b";
  }
  function toast(msg,warn){
    var el=$("toast");el.textContent=msg;el.className="toast on"+(warn?" warn":"");
    clearTimeout(toast.t);toast.t=setTimeout(function(){el.className="toast"},1400);
  }
  function currentCopyText(){
    var ta=$("d-content"), s=ta.selectionStart, e=ta.selectionEnd;
    if(e>s) return ta.value.slice(s,e);
    var r=lineRange(ta.value,s);
    return ta.value.slice(r[0],r[1]).replace(/\r$/,"");
  }
  function doCopy(text){
    var ta=$("d-content"), s=ta.selectionStart, e=ta.selectionEnd;
    if(!text){toast("没有可复制的内容",true);return}
    copyText(text).then(function(){toast("✓ 已复制")},function(){toast("复制失败",true)})
    .then(function(){ // 把焦点和选区还给文本框，保持选区/光标位置可见
      try{ta.focus({preventScroll:true});ta.setSelectionRange(s,e);paintLine()}catch(x){}
    });
  }
  ["click","keyup","touchend","mouseup","select"].forEach(function(ev){
    $("d-content").addEventListener(ev,function(){setTimeout(paintLine,0)})});
  document.addEventListener("selectionchange",function(){
    if(document.activeElement===$("d-content")) paintLine()});
  window.addEventListener("resize",function(){if($("v-detail").classList.contains("on")){fitEditor();paintLine()}});
  function copyText(t){
    if(navigator.clipboard&&navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
    return new Promise(function(res,rej){
      var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.select();
      try{document.execCommand("copy")?res():rej()}catch(e){rej(e)}
      document.body.removeChild(ta);
    });
  }

  /* ---------- 事件 ---------- */
  $("q").addEventListener("input",function(e){state.q=e.target.value;render()});
  $("chips").addEventListener("click",function(e){
    var b=e.target.closest(".chip"); if(!b) return; state.cat=b.getAttribute("data-c"); render()});
  $("list").addEventListener("click",function(e){
    var it=e.target.closest(".item"); if(it) openNote(it.getAttribute("data-id"))});
  $("btn-back").onclick=function(){show("v-list")};
  $("btn-refresh").onclick=sync;
  $("btn-copy").addEventListener("mousedown",function(e){e.preventDefault()}); // 桌面浏览器点按钮时不丢选区
  $("btn-copy").onclick=function(){doCopy(currentCopyText())};
  $("btn-copy-all").onclick=function(){doCopy(state.cur?String(state.cur.Content||""):"")};
  $("btn-settings").onclick=function(){
    var c=loadJSON(KEY_CFG)||{};
    $("f-repo").value=c.owner?("https://github.com/"+c.owner+"/"+c.repo):"";
    $("f-branch").value=c.branch||"main";
    $("f-token").value=c.token||"";
    $("f-err").textContent="";
    var cc=loadJSON(KEY_CCFG)||{};
    $("f-crepo").value=cc.repo||""; $("f-cbranch").value=cc.branch||"main"; $("f-ctoken").value=cc.token||"";
    $("f-cerr").textContent="";
    show("v-settings");
  };
  $("btn-set-back").onclick=function(){show("v-list")};
  $("btn-save").onclick=function(){
    var r=parseRepo($("f-repo").value), tk=$("f-token").value.trim();
    if(!r){$("f-err").textContent="仓库地址格式不对，应类似 https://github.com/用户名/仓库名";return}
    if(!tk){$("f-err").textContent="请填写访问令牌";return}
    sset(KEY_CFG,JSON.stringify({owner:r.owner,repo:r.repo,branch:$("f-branch").value.trim()||"main",token:tk}));
    $("f-err").textContent="";
    show("v-list");
    sync();
  };
  $("btn-clear").onclick=function(){
    if(!confirm("确定清除本机保存的令牌（含聊天令牌）和缓存吗？（不会影响 GitHub 上的数据）")) return;
    sdel(KEY_CFG); sdel(KEY_DATA); sdel(KEY_CCFG); sdel(KEY_CMSG);
    chat.msgs={};chat.names=[];chat.bad={};
    state.notes=[];state.cats=[];state.cat="全部";render();
    $("status").textContent="";
    show("v-settings");
  };
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden && loadJSON(KEY_CFG) && $("v-list").classList.contains("on")) sync();
  });

  /* ---------- 聊天（手机 ↔ 电脑，经 GitHub 仓库中转） ---------- */
  var KEY_CCFG="sn.chatcfg", KEY_CMSG="sn.chatmsgs", DEVICE="phone", POLL_MS=4000;
  var chat={msgs:{},names:[],timer:null,busy:false,bad:{},active:false};

  function chatCfg(){
    var c=loadJSON(KEY_CCFG); if(!c) return null;
    var r=parseRepo(c.repo); if(!r||!c.token) return null;
    return {owner:r.owner,repo:r.repo,branch:c.branch||"main",token:c.token};
  }
  function cReq(cfg,path,opt){
    opt=opt||{};
    var url="https://api.github.com/repos/"+cfg.owner+"/"+cfg.repo+(path?"/"+path:"");
    return fetch(url,{method:opt.method||"GET",cache:"no-store",body:opt.body,headers:{
      "Accept":opt.raw?"application/vnd.github.raw+json":"application/vnd.github+json",
      "Authorization":"Bearer "+cfg.token,"X-GitHub-Api-Version":"2022-11-28"}});
  }
  function errText(r){return r.text().then(function(t){
    var m=""; try{m=JSON.parse(t).message}catch(e){}
    return "HTTP "+r.status+(m?"："+m:"")})}
  function b64utf8(str){
    var bytes=new TextEncoder().encode(str),bin="";
    for(var i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function cStatus(t){$("chat-status").textContent=t}

  function chatList(cfg){
    return cReq(cfg,"contents/msgs?ref="+encodeURIComponent(cfg.branch)+"&_="+Date.now()).then(function(r){
      if(r.status===404){
        return cReq(cfg,"").then(function(pr){
          if(pr.status===404||pr.status===401) throw new Error("访问不到聊天仓库：请检查仓库地址，以及令牌是否授权了该仓库（Contents: Read and write）");
          return [];
        });
      }
      if(!r.ok) return errText(r).then(function(m){throw new Error(m)});
      return r.json().then(function(a){
        return a.filter(function(x){return x.type==="file"&&/\.json$/i.test(x.name)})
                .map(function(x){return x.name}).sort();
      });
    });
  }
  function chatGet(cfg,name){
    return cReq(cfg,"contents/msgs/"+encodeURIComponent(name)+"?ref="+encodeURIComponent(cfg.branch),{raw:true}).then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.text();
    }).then(function(t){
      var o=JSON.parse(t.replace(/^\uFEFF/,""));
      return {name:name,from:o.from||"",time:o.time||"",text:o.text==null?"":String(o.text)};
    });
  }
  function chatRender(forceBottom){
    var box=$("chat-msgs");
    var near=box.scrollHeight-box.scrollTop-box.clientHeight<60;
    if(!chat.names.length){
      box.innerHTML='<div class="empty">还没有消息<br>在下面输入文字，发送到电脑</div>';
    }else{
      box.innerHTML=chat.names.map(function(n){
        var m=chat.msgs[n], me=m.from===DEVICE;
        var who=me?"我":(m.from==="pc"?"电脑":esc(m.from));
        return '<div class="row'+(me?' me':'')+'"><div><div class="bub">'+esc(m.text)+'</div>'+
          '<div class="bmeta"><span>'+who+' · '+esc(fmt(m.time))+'</span><button data-n="'+esc(n)+'">复制</button></div></div></div>';
      }).join("");
    }
    if(forceBottom||near) box.scrollTop=box.scrollHeight;
    try{sset(KEY_CMSG,JSON.stringify(chat.names.slice(-200).map(function(n){return chat.msgs[n]})))}catch(e){}
  }
  function chatPoll(forceBottom){
    var cfg=chatCfg();
    if(!cfg){cStatus("尚未配置：点右上角 ⚙︎ 填写聊天仓库和令牌");return Promise.resolve()}
    if(chat.busy) return Promise.resolve();
    chat.busy=true;
    return chatList(cfg).then(function(names){
      var have={}; names.forEach(function(n){have[n]=1});
      var changed=false;
      chat.names.slice().forEach(function(n){ // 电脑端清理掉的消息
        if(!have[n]){delete chat.msgs[n];changed=true}});
      var todo=names.filter(function(n){return !chat.msgs[n]&&!chat.bad[n]});
      return todo.reduce(function(p,n){
        return p.then(function(){return chatGet(cfg,n).then(function(m){chat.msgs[n]=m;changed=true},
          function(){chat.bad[n]=1})});
      },Promise.resolve()).then(function(){
        chat.names=Object.keys(chat.msgs).sort();
        if(changed||forceBottom) chatRender(forceBottom);
        cStatus("已连接 · 共 "+chat.names.length+" 条");
      });
    }).catch(function(e){
      var msg=(e&&e.message)||String(e);
      if(/Failed to fetch|NetworkError|Load failed/i.test(msg)) msg="网络连接失败，稍后自动重试";
      cStatus("⚠️ "+msg);
    }).then(function(){chat.busy=false});
  }
  function fitChat(){
    var w=document.querySelector(".chat-wrap"), vv=window.visualViewport;
    if(!w) return;
    if(vv){w.style.height=vv.height+"px";w.style.top=vv.offsetTop+"px"}
    else{w.style.height="";w.style.top=""}
    var box=$("chat-msgs"); if(box&&chat.active) box.scrollTop=box.scrollHeight;
  }
  if(window.visualViewport){
    window.visualViewport.addEventListener("resize",fitChat);
    window.visualViewport.addEventListener("scroll",function(){if(chat.active){window.scrollTo(0,0);fitChat()}});
  }
  function stopChat(){chat.active=false;if(chat.timer){clearInterval(chat.timer);chat.timer=null}}
  function startChat(){
    show("v-chat"); chat.active=true;
    var cached=loadJSON(KEY_CMSG);
    if(cached&&!chat.names.length){cached.forEach(function(m){chat.msgs[m.name]=m});chat.names=Object.keys(chat.msgs).sort()}
    chatRender(true);
    chatPoll(true);
    chat.timer=setInterval(function(){if(!document.hidden) chatPoll(false)},POLL_MS);
  }
  function chatSend(override){
    var ta=$("chat-input"), fromPaste=(typeof override==="string");
    var text=(fromPaste?override:ta.value).replace(/\s+$/,"");
    if(!text) return;
    var cfg=chatCfg(); if(!cfg){cStatus("尚未配置：点右上角 ⚙︎ 填写聊天仓库和令牌");return}
    var btns=[$("chat-send"),$("chat-paste")]; btns.forEach(function(b){b.disabled=true});
    var rnd=Math.random().toString(36).slice(2,6);
    var d=new Date(), p=function(n,l){n=String(n);while(n.length<(l||2))n="0"+n;return n};
    var name=d.getUTCFullYear()+p(d.getUTCMonth()+1)+p(d.getUTCDate())+p(d.getUTCHours())+p(d.getUTCMinutes())+p(d.getUTCSeconds())+p(d.getUTCMilliseconds(),3)+"-"+DEVICE+"-"+rnd+".json";
    var msg={from:DEVICE,time:d.toISOString(),text:text};
    var body={message:"msg",content:b64utf8(JSON.stringify(msg)),branch:cfg.branch};
    function put(b){return cReq(cfg,"contents/msgs/"+name,{method:"PUT",body:JSON.stringify(b)})}
    cStatus("正在发送…");
    put(body).then(function(r){
      if(!r.ok) return errText(r).then(function(m){
        if(/branch/i.test(m)){delete body.branch;return put(body).then(function(r2){
          if(!r2.ok) return errText(r2).then(function(m2){throw new Error(m2)})})}
        throw new Error(m)});
    }).then(function(){
      msg.name=name; chat.msgs[name]=msg; chat.names=Object.keys(chat.msgs).sort();
      if(!fromPaste){ta.value=""; ta.style.height="auto"}
      chatRender(true); cStatus(fromPaste?"已粘贴并发送":"已发送");
    }).catch(function(e){
      var m=(e&&e.message)||String(e);
      if(/Failed to fetch|NetworkError|Load failed/i.test(m)) m="网络连接失败，发送未成功，请重试";
      if(/Resource not accessible|403/.test(m)) m+="（令牌需要 Contents: Read and write 权限）";
      cStatus("⚠️ 发送失败："+m);
    }).then(function(){btns.forEach(function(b){b.disabled=false})});
  }
  function chatPasteSend(){
    if(!navigator.clipboard||!navigator.clipboard.readText){
      cStatus("⚠️ 此浏览器不支持读取剪贴板，请在输入框里长按粘贴后点「发送」");return}
    navigator.clipboard.readText().then(function(t){
      if(!t||!t.trim()){cStatus("剪贴板里没有文字");return}
      chatSend(t);
    },function(){
      cStatus("⚠️ 没有获得读取剪贴板的许可。请在弹出的「粘贴」提示上点允许，或在输入框里长按粘贴后点「发送」");
    });
  }
  $("btn-chat").onclick=startChat;
  $("btn-chat-back").onclick=function(){show("v-list")};
  $("btn-chat-set").onclick=function(){$("btn-settings").onclick();
    setTimeout(function(){var e=$("f-crepo");if(e&&e.scrollIntoView)e.scrollIntoView()},50)};
  $("chat-send").onclick=function(){chatSend()};
  $("chat-paste").onclick=chatPasteSend;
  $("chat-input").addEventListener("input",function(){this.style.height="auto";this.style.height=Math.min(this.scrollHeight,120)+"px"});
  $("chat-msgs").addEventListener("click",function(e){
    var b=e.target.closest("button[data-n]"); if(!b) return;
    var m=chat.msgs[b.getAttribute("data-n")]; if(!m) return;
    copyText(m.text).then(function(){b.textContent="已复制 ✓"},function(){b.textContent="失败"});
    setTimeout(function(){b.textContent="复制"},1200);
  });
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden&&chat.active) chatPoll(false)});
  $("btn-csave").onclick=function(){
    var r=parseRepo($("f-crepo").value), tk=$("f-ctoken").value.trim();
    if(!r){$("f-cerr").textContent="仓库地址格式不对，应类似 https://github.com/用户名/仓库名";return}
    if(!tk){$("f-cerr").textContent="请填写聊天令牌";return}
    sset(KEY_CCFG,JSON.stringify({repo:"https://github.com/"+r.owner+"/"+r.repo,branch:$("f-cbranch").value.trim()||"main",token:tk}));
    chat.msgs={};chat.names=[];chat.bad={};sdel(KEY_CMSG);
    $("f-cerr").textContent="";
    startChat();
  };

  /* ---------- 启动 ---------- */
  var cached=loadJSON(KEY_DATA);
  if(cached){applyData(cached);$("status").textContent="上次同步 · "+fmt(cached.syncedAt)}
  show(loadJSON(KEY_CFG)?"v-list":"v-settings");
  if(!cached) render();
  if(loadJSON(KEY_CFG)) sync();
})();
</script>
</body>
</html>
